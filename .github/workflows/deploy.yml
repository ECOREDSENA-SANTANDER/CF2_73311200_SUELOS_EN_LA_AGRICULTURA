name: Deploy Vue App to GitHub Pages

on:
  push:
    branches:
      - master

# Evita que dos despliegues se ejecuten simultáneamente
concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Descargar el repositorio
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 14
          cache: npm

      # Instalar dependencias
      - name: Install Dependencies
        run: npm ci

      # Compilar proyecto Vue
      - name: Build Vue App
        run: npm run build

      # Publicar directamente dist en gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy Vue App to GitHub Pages'
